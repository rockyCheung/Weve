<svg width="800" height="240" viewBox="0 0 800 240" xmlns="http://www.w3.org/2000/svg">
  <!-- 图标底 -->
  <rect x="24" y="28" width="184" height="184" rx="44" fill="#0B2545"/>

  <!-- 财务流：金色 -->
  <path d="M58 82 L102 172 L134 116"
        fill="none"
        stroke="#F4B942"
        stroke-width="16"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- 人员流：青绿色 -->
  <path d="M134 116 L166 172 L210 82"
        fill="none"
        stroke="#2EC4B6"
        stroke-width="16"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- 智能中枢节点 -->
  <circle cx="134" cy="116" r="10" fill="#FFFFFF"/>

  <!-- 两端节点：人员/财务连接点 -->
  <circle cx="58" cy="82" r="7" fill="#F4B942"/>
  <circle cx="210" cy="82" r="7" fill="#2EC4B6"/>

  <!-- 品牌名 -->
  <text x="240" y="150"
        font-family="Inter, 'SF Pro Display', 'PingFang SC', 'Microsoft YaHei', sans-serif"
        font-size="88"
        font-weight="700"
        fill="#0B2545"
        letter-spacing="-2">Weve</text>

  <!-- 副标 -->
  <text x="244" y="190"
        font-family="Inter, 'SF Pro Display', 'PingFang SC', 'Microsoft YaHei', sans-serif"
        font-size="18"
        font-weight="500"
        fill="#5B6B7F"
        letter-spacing="4">FINANCE · PEOPLE</text>
</svg>